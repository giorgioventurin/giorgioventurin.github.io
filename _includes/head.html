<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>
    {% if page.title == "Homepage" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/poole.css">
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/syntax.css">
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/hyde.css">
  <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=PT+Sans:400,400italic,700|Abril+Fatface">

  <!-- Icons -->
<!--  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/public/apple-touch-icon-144-precomposed.png">-->
  <link rel="shortcut icon" href="{{ site.baseurl }}public/favicon.ico">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">

 <style>
    /* Mobile sidebar toggle button */
    .sidebar-toggle {
      display: none; /* Hidden by default */
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1001; /* Above backdrop */
      background-color: #333; /* Dark background */
      color: #fff; /* White text */
      border: none;
      border-radius: 5px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Show the toggle button on screens smaller than 768px (common tablet breakpoint) */
    @media (max-width: 768px) {
      .sidebar-toggle {
        display: block;
      }

      /* Backdrop behind the sidebar on mobile */
      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 998;
        opacity: 0;
        transition: opacity 220ms ease-out;
      }

      body.sidebar-show .sidebar-backdrop {
        display: block;
        opacity: 1;
        transition: opacity 260ms ease-out;
      }

      /* Hide the sidebar by default on small screens */
      .sidebar {
        transform: translate3d(-100%, 0, 0); /* Move off-screen to the left */
        will-change: transform;
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        /* Adjusted width to fit the display size using viewport width units */
        width: 80vw; /* Takes up 80% of the viewport width */
        max-width: 280px; /* Optional: Keep a maximum width for larger mobile devices/tablets */
        z-index: 999;
        /* Smoother transition than linear/ease-in-out */
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 2px 0 14px rgba(0,0,0,0.25);
        -webkit-overflow-scrolling: touch;
        overflow-y: auto;
      }

      /* When 'sidebar-show' class is added, bring it into view */
      body.sidebar-show .sidebar { /* Target body.sidebar-show specifically */
        transform: translate3d(0, 0, 0);
      }

      /* Keep the background content in place (don't shift it when the sidebar is open) */
      body.sidebar-show .content {
        margin-left: initial;
        transition: none;
      }

      /* Respect reduced-motion preferences */
      @media (prefers-reduced-motion: reduce) {
        .sidebar,
        .sidebar-backdrop {
          transition: none !important;
        }
      }
    }
  </style>

  <script>
    // JavaScript to handle sidebar toggle
    document.addEventListener('DOMContentLoaded', function () {
      const toggleButton = document.querySelector('.sidebar-toggle');
      const body = document.body;
      const mq = window.matchMedia('(max-width: 768px)');
      const sidebar = document.querySelector('.sidebar');

      function isSmallScreen() {
        try {
          return mq.matches;
        } catch (e) {
          return window.innerWidth <= 768;
        }
      }

      // Ensure we have a single backdrop element in the DOM
      let backdrop = document.querySelector('.sidebar-backdrop');
      if (!backdrop) {
        backdrop = document.createElement('div');
        backdrop.className = 'sidebar-backdrop';
        // Put it early so it sits behind the sidebar and toggle button
        body.insertBefore(backdrop, body.firstChild);
      }

      function setSidebarState(open) {
        if (open) body.classList.add('sidebar-show');
        else body.classList.remove('sidebar-show');
      }

      // Initial state (mobile): show the sidebar ONLY on the first entry to the site (per session).
      // After that, keep it hidden by default, but still reopenable via the toggle button.
      if (isSmallScreen()) {
        let hasAutoOpened = false;
        try {
          hasAutoOpened = sessionStorage.getItem('sidebarAutoOpened') === '1';
        } catch (e) {
          // sessionStorage may be unavailable; treat as not opened
          hasAutoOpened = false;
        }

        if (!hasAutoOpened) {
          setSidebarState(true);
          try {
            sessionStorage.setItem('sidebarAutoOpened', '1');
          } catch (e) {
            // ignore
          }
        } else {
          setSidebarState(false);
        }
      }

      // Toggle handler (open/close/reopen)
      if (toggleButton) {
        toggleButton.addEventListener('click', function (evt) {
          evt.preventDefault();
          const willOpen = !body.classList.contains('sidebar-show');
          setSidebarState(willOpen);
        });
      }

      // Close when tapping on the backdrop (outside the sidebar)
      backdrop.addEventListener('click', function () {
        if (!isSmallScreen()) return;
        setSidebarState(false);
      });

      // Close sidebar after clicking an internal navigation link (mobile only)
      if (sidebar) {
        sidebar.addEventListener('click', function (evt) {
          const link = evt.target && evt.target.closest ? evt.target.closest('a') : null;
          if (!link) return;
          if (!isSmallScreen()) return;

          const href = link.getAttribute('href') || '';
          // Close for internal navigation; keep mailto/external usable without forcing close
          const isInternal = href.startsWith('/') || href.startsWith('#') || href.startsWith('{{ site.baseurl }}');
          if (isInternal) {
            setSidebarState(false);
          }
        });
      }

      // When going from mobile -> desktop, drop the mobile-only class
      window.addEventListener('resize', function () {
        if (!isSmallScreen()) {
          body.classList.remove('sidebar-show');
        }
      });
    });
  </script>

</head>
